[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-messenger"
version = "3.1.3"
description = "Local-first coordination infrastructure for organizations of AI agents — secure Unix-socket messaging, tasks, groups and approvals (API v2)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Synapse Project" }]
keywords = ["ai", "agents", "messaging", "coordination", "workforce", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.4",
    "orjson>=3.9",
]

[project.urls]
Homepage = "https://github.com/baronmuh/synapse-messenger"
Source = "https://github.com/baronmuh/synapse-messenger"
Releases = "https://github.com/baronmuh/synapse-messenger/releases"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-xdist>=3.6.0", "pytest-cov>=5.0.0", "pip-tools>=7.4.0"]

[project.scripts]
synapse = "synapse.cli:main"
synapse-server = "synapse.cli.aliases:server_alias_main"
synapse-web = "synapse.cli.aliases:web_alias_main"
synapse-init-org = "synapse.cli.aliases:init_org_alias_main"
synapse-backup = "synapse.cli.aliases:backup_alias_main"
synapse-restore = "synapse.cli.aliases:restore_alias_main"
synapse-a2a-bridge = "synapse.cli.aliases:a2a_bridge_alias_main"

[tool.setuptools.packages.find]
include = ["synapse*"]

[tool.setuptools.package-data]
"synapse" = ["webui/**/*", "webui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
