name: Smoke CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Install and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Check version
        run: synapse --version
      - name: "Smoke: org init, server, first message"
        run: |
          set -e
          export SYNAPSE_CONFIG=/tmp/synapse-smoke/config.json
          mkdir -p /tmp/synapse-smoke
          cat > "$SYNAPSE_CONFIG" <<'EOF'
          {"storage_dir": "/tmp/synapse-smoke/data", "socket_path": "/tmp/synapse-smoke/run/synapse.sock", "log_dir": "/tmp/synapse-smoke/logs", "backup_dir": "/tmp/synapse-smoke/backups"}
          EOF
          printf 'smoke-org-pass-1' | synapse org init demo_org --password-stdin
          synapse server start
          printf 'agent-a-pass-1' | synapse agent create agent_a --description "Smoke agent" --password-stdin
          printf 'agent-b-pass-1' | synapse agent create agent_b --description "Smoke agent" --password-stdin
          printf 'agent-a-pass-1' | synapse message send agent_b "Hello from smoke test" --client-message-id smoke-1 --my-name agent_a --password-stdin
          printf 'agent-b-pass-1' | synapse message inbox --unread --my-name agent_b --password-stdin
          synapse server stop
          echo "SMOKE OK"
